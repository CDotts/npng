blocks:
  # id é contrato: fica gravado em cada sessão e nunca é renomeado.
  # name é livre e segue a contagem do Caio, não a numeração do método.
  - id: meso2_acumulacao
    name: "Bloco 1 — acumulação"
    type: acumulacao
    weeks: 4
    deload_week: 5
    rule: sets_ramp
    intensity_pct: 80
    days:
      - id: A
        name: "Superior — empurrar"
        exercises:
          - supino_reto_barra
          - remada_curvada_barra
          - desenvolvimento_barra
          - puxada_aberta
          - triceps_polia
          - rosca_direta_halteres

      - id: B
        name: "Inferior — joelho"
        exercises:
          - agachamento_livre
          - stiff_barra
          - leg_press
          - mesa_flexora
          - panturrilha_leg_press

      - id: C
        name: "Superior — puxar"
        exercises:
          - barra_fixa
          - supino_inclinado_halteres
          - remada_baixa
          - desenvolvimento_maquina
          - crucifixo_crossover
          - rosca_direta_halteres

      - id: D
        name: "Inferior — quadril"
        exercises:
          - levantamento_terra
          - cadeira_extensora
          - hip_thrust
          - panturrilha_smith
          - abdominal_crunch
