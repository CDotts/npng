
muscles:
  peitoral: { min: 10, max: 14 }
  costas: { min: 10, max: 14 }
  quadriceps: { min: 10, max: 14 }
  posteriores: { min: 8, max: 12 }
  gluteos: { min: 3, max: 8 }
  lombar: { min: 4, max: 10 }
  deltoide: { min: 6, max: 10 }
  biceps: { min: 6, max: 10 }
  triceps: { min: 3, max: 8 }
  panturrilha: { min: 6, max: 10 }
  abdomen: { min: 3, max: 6 }

exercises:
  - id: supino_reto_barra
    name: Supino reto com barra
    photo: ex/banco_supino_reto.jpg
    pattern: push_h
    class: multi_sup_livre
    primary: [peitoral]
    secondary: [triceps, deltoide]
    sets: 2
    ramp: true
    reps: [6, 8]
    rir: 2
    increment: 2.5
    load_unit: "por lado"
    bar_kg: 20
    rest: 180
    failure_ok: false
    seed_kg: 31
    warmup_hint: true
    setup_hint: "Banco de supino reto, suporte na altura do punho"

